name: Deploy to production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: node scripts/check-inquiries.mjs
      - run: node scripts/check-operations.mjs
      - run: pnpm build:server
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          SERVER: root@47.238.71.113
        run: |
          set -eo pipefail
          deploy() {
          echo "MARK0: function entered"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          [ -n "$SSH_KEY" ] || { echo "DIAG: SSH_DEPLOY_KEY 为空（secret 名或值有问题）"; exit 1; }
          # 清洗粘贴常见杂质：围栏、行首尾空白、空行、CRLF
          printf '%s\n' "$SSH_KEY" | sed -e 's/\r$//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' -e '/^```/d' > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1 && echo "DIAG: key 格式 OK" || { echo "DIAG: key 格式无效（BEGIN/END 是否完整、是否为私钥而非公钥）"; exit 1; }
          echo "DIAG: SERVER 已配置（硬编码）"
          printf '%s\n' \
            '47.238.71.113 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEjWaG0bPAUFRiDNga4FHhCCZ81mDLc0UwYiD69dmfOE' \
            '47.238.71.113 ssh-rsa ' >> ~/.ssh/known_hosts

          # Package source (same exclusions as the manual deploy); the archive
          # must live outside the tree so tar never sees it as a changing file.
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=dist-node \
              --exclude=.wrangler --exclude=output --exclude=设备预览 --exclude='.env*' --exclude='data' --exclude='backups' --exclude='secrets' \
              -czf /tmp/source.tar.gz .

          ssh -i ~/.ssh/deploy_key -o BatchMode=yes $SERVER 'mkdir -p /opt/loongjump-website/upload'
          scp -i ~/.ssh/deploy_key -o BatchMode=yes /tmp/source.tar.gz $SERVER:/opt/loongjump-website/upload/

          # Build before switching, snapshot data, and roll back on failed health checks.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes $SERVER 'set -e
            cd /opt/loongjump-website
            if [ -d app.new ]; then mv app.new "app.pending-$(date -u +%Y%m%dT%H%M%SZ)"; fi
            mkdir app.new
            tar xzf upload/source.tar.gz -C app.new
            bash app.new/server/deploy.sh'

          echo "Deploy OK"
          }
          echo "MARK-A: about to call deploy function"
          deploy 2>&1 | tee /tmp/deploy.log
          echo "MARK-B: deploy function returned"

      - name: Report deploy log to ci-diag branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-diag
          { cp /tmp/deploy.log deploy.log 2>/dev/null || echo "deploy.log not found" > deploy.log; }
          git add deploy.log
          git commit -m "CI deploy log $(date -u +%FT%TZ)" || true
          git push origin ci-diag --force
